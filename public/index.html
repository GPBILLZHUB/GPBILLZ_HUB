<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPBILLZ_HUB</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="topbar">
    <div class="brand">
      <div class="logo">G</div>
      <span>GPBILLZ_HUB</span>
    </div>
    <div class="status">● Online</div>
  </header>

  <main class="container">

    <section class="hero">
      <div class="eyebrow">FAST • SIMPLE • SECURE</div>
      <h1>Data & Airtime<br>Made Easy.</h1>
      <p class="hero-copy">
        Buy data, airtime and subscriptions quickly with GPBILLZ_HUB.
      </p>
    </section>

    <div class="tabs">
      <button class="tab active" data-type="data">Data</button>
      <button class="tab" data-type="airtime">Airtime</button>
      <button class="tab" data-type="subscription">Subscriptions</button>
    </div>

    <section class="card">

      <label for="plan">Choose a plan</label>
      <select id="plan"></select>

      <label for="phone">Phone number</label>
      <input
        id="phone"
        type="tel"
        placeholder="08012345678"
        maxlength="11"
      >

      <label for="email">Email address</label>
      <input
        id="email"
        type="email"
        placeholder="you@example.com"
      >

      <div class="summary">
        <span>Total</span>
        <strong id="total">₦0</strong>
      </div>

      <div id="message" class="message"></div>

      <button id="pay" class="pay">
        Pay with Paystack
      </button>

    </section>

    <section class="features">
      <div>
        <strong>⚡ Fast delivery</strong>
        <span>Get your purchase quickly.</span>
      </div>

      <div>
        <strong>🔒 Secure payment</strong>
        <span>Payments powered by Paystack.</span>
      </div>

      <div>
        <strong>📱 Easy to use</strong>
        <span>Simple mobile-friendly experience.</span>
      </div>
    </section>

  </main>

  <footer>
    © <span id="year"></span> GPBILLZ_HUB
  </footer>

  <script src="app.js"></script>
</body>
</html>
